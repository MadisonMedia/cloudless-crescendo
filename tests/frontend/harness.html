<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Crescendo frontend harness</title>

    const paintAfter = painted.shadowRoot.querySelector(".js-grad").style.backgroundImage;
    report("active colors: shown when a color is chosen", chipCount(painted) === 2, chipCount(painted));
    report("active colors: the control follows a chosen color at once", paintBefore !== paintAfter && paintAfter.includes("255, 51, 0"), paintAfter.slice(0, 60));
    report("active colors: the control shows the chosen color, not a mix", getComputedStyle(painted).getPropertyValue("--reg").replace(/\s/g, "") === "rgb(255,51,0)", getComputedStyle(painted).getPropertyValue("--reg"));
    painted.hass = hass;
    await wait(60);
    report("active colors: gone with the chosen color", chipCount(painted) === 0 && painted.shadowRoot.querySelector(".js-grad").style.backgroundImage === paintBefore);
    const always = await newCard({ colors_always: true });
    report("active colors: can always be shown", chipCount(always) === 1, chipCount(always));
    const member = redFloor();
    always.hass = { ...hass, states: { ...hass.states, "light.boden": member.states["light.boden"], "light.spiegel": member.states["light.spiegel"] } };
    await wait(60);
    report("active colors: follow a single light without the object changing", chipCount(always) === 2, chipCount(always));
    const flat = await newCard({ color: "solid" }, redFloor());
    const bands = flat.shadowRoot.querySelector(".js-grad").style.backgroundImage;
    report("active colors: flat controls show them side by side", bands.includes("255, 51, 0") && bands.includes("50%"), bands.slice(0, 110));
    const flatDial = await newCard({ color: "solid", design: "dial" }, redFloor());
    const strokes = new Set([...flatDial.shadowRoot.querySelectorAll(".dial-seg")].map((s) => s.style.stroke));
    report("active colors: on the dial too", strokes.size === 2, [...strokes].join(" "));
    const flatOne = await newCard({ color: "solid" });
    const single = flatOne.shadowRoot.querySelector(".js-grad").style.backgroundImage;
    flatOne.hass = redFloor();
    await wait(60);
    report("active colors: flat controls follow the lights", flatOne.shadowRoot.querySelector(".js-grad").style.backgroundImage !== single);
    // The card's settings.
    editor.addEventListener("config-changed", (e) => editor.setConfig(e.detail.config));
    const ed = (sel) => editor.shadowRoot.querySelector(sel);
    ed("#advanced").open = true;
    await wait(30);
    ed("#glow").click();
    await wait(30);
    report("advanced settings stay open after a change", ed("#advanced").open === true);
    const pick = async (design) => { ed(`[data-design="${design}"]`).click(); await wait(30); };
    await pick("dial");
    report("no horizontal slider setting for the dial", !ed("#slider") && !!ed("#dial_wedge"));
    await pick("gradient");
    report("horizontal slider setting where it exists", !!ed("#slider") && !ed("#dial_wedge"));
    report("single lights setting in plain sight", !!ed("#details") && !ed("#details").closest("details") && ed("#details").value === "button");
    ed("#details").value = "both";
    ed("#details").dispatchEvent(new Event("change", { bubbles: true }));
    await wait(30);
    report("single lights setting is saved", editor._config.details === "both" && ed("#details").value === "both");
    report("combining is offered for the single lights", !!ed("#group"));
    ed("#details").value = "button";
    ed("#details").dispatchEvent(new Event("change", { bubbles: true }));
    await wait(30);
    await pick("columns");
    report("no single lights setting on the columns design", !ed("#details"));
    await pick("gradient");
    await pick("picture");
    report("photo upload is in plain sight", !!ed("#pick-photo") && !ed("#pick-photo").closest("details"));
    await pick("mixer");
    report("mixer channels are in plain sight", !!ed("#add-channel") && !ed("#add-channel").closest("details"));
    report("empty lanes hidden", getComputedStyle(cards[8].shadowRoot.querySelector(".js-lanes")).display === "none");
    report("mixer master has gradient", cards[7].shadowRoot.querySelector(".ch .well").style.backgroundImage !== "");
    // In the page: dragging a point in the chart saves the new value.
    calls.length = 0;
    const box = q("#chartBox");
    capture(box);
    const hit = [...panel.shadowRoot.querySelectorAll(".c-hit")].find((c) => +c.getAttribute("cx") > 400);
    const hr = hit.getBoundingClientRect();
    point(hit, "pointerdown", hr.left + 5, hr.top + 5);
    point(hit, "pointermove", hr.left + 5, hr.top + 45);
    const after1 = panel.shadowRoot.querySelectorAll(".c-hit");
    point(after1[0], "pointermove", hr.left + 5, hr.top + 65);
    point(after1[0], "pointerup", hr.left + 5, hr.top + 65);
    await wait(700);
    const saves = calls.filter((c) => c.type === "cloudless_crescendo/object/save");
    report("chart drag saves", saves.length === 1, saves[0] ? JSON.stringify(saves[0].options.stops.map((s) => Object.values(s.values).map((v) => v.brightness))) : "");
    report("saved options have no helper ids", saves[0] && !JSON.stringify(saves[0].options).includes("_sid"));
    report("chart drag previews", calls.some((c) => c.type === "cloudless_crescendo/preview"));
    const shape = () => JSON.stringify(panel._o.options.stops.map((s) => Object.values(s.values).map((v) => v.brightness)));
    const before = shape();
    q('[data-act="undo"]').click();
    await wait(20);
    report("undo", before !== shape(), `${before} -> ${shape()}`);
    const stops = panel._o.options.stops.length;
    q('[data-act="add-stop"]').click();
    report("add stop", panel._o.options.stops.length === stops + 1);
    q("#addSel").value = "l:light.bogen";
    q('[data-act="add-item"]').click();
    report("add light", panel._o.options.lights.some((l) => l.entity_id === "light.bogen"));
    report("new light has a value at every stop", panel._o.options.stops.every((s) => s.values["light.bogen"]));
    q('[data-v="diag"]').click();
    await wait(200);
    report("test question closed at start", getComputedStyle(q("#testAsk")).display === "none");
    calls.length = 0;
    q('[data-act="test-ask"]').click();
    report("asking warns and does not test yet", getComputedStyle(q("#testAsk")).display !== "none" && !calls.some((c) => c.type === "cloudless_crescendo/test_connection"), q("#testAskText").textContent);
    q('[data-act="test-run"]').click();
    await wait(100);
    report("test runs after confirming", calls.some((c) => c.type === "cloudless_crescendo/test_connection"));
  }
  console.log(`HARNESS width ${window.innerWidth} horizontal-scroll=${document.documentElement.scrollWidth > window.innerWidth}`);
  console.log("HARNESS-DONE");
}, 400);
window.addEventListener("error", (e) => console.log("HARNESS-ERROR", e.message, e.filename, e.lineno));
window.addEventListener("unhandledrejection", (e) => console.log("HARNESS-ERROR", String(e.reason)));
</script>
</body></html>
